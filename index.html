<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Nivelador de Carabina - 3 Ejes Espaciales</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --primary: #00e676;
      --danger: #ff5252;
      --warning: #ffd600;
      --text: #ffffff;
      --subtext: #aaaaaa;
      --border: #333333;
      --violet: #e040fb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      min-height: 100vh;
    }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 10px; }
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    h1 { font-size: 1.1rem; text-align: center; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }
    
    /* Panel de Diagnóstico */
    .diag-panel {
      background-color: #181818;
      border-left: 4px solid var(--warning);
      font-size: 0.75rem;
      font-family: monospace;
    }
    .diag-title { font-weight: bold; color: var(--warning); margin-bottom: 2px; font-size: 0.8rem; }
    .diag-item { display: flex; justify-content: space-between; }
    .status-ok { color: var(--primary); font-weight: bold; }
    .status-bad { color: var(--danger); font-weight: bold; }

    /* LAYOUT PRINCIPAL DE SENSORES Y NIVELES (X, Y, Z) */
    .main-grid {
      display: grid;
      grid-template-columns: 44px 1fr;
      grid-template-rows: auto auto;
      gap: 10px;
      align-items: center;
      margin-top: 4px;
    }

    /* EJE X: NIVEL LONGITUDINAL VIOLETA (BARRA VERTICAL EN PANTALLA) */
    .level-vertical-wrapper {
      grid-column: 1;
      grid-row: 1 / span 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      min-height: 220px;
      background: #151515;
      border: 2px solid var(--violet);
      border-radius: 22px;
      position: relative;
      overflow: hidden;
      justify-content: center;
    }
    .level-v-ring {
      position: absolute;
      width: 100%;
      height: 40px;
      border-top: 2px dashed var(--warning);
      border-bottom: 2px dashed var(--warning);
      background: rgba(255, 214, 0, 0.08);
    }
    .bubble-v {
      width: 28px;
      height: 28px;
      background: var(--violet);
      border-radius: 50%;
      position: absolute;
      box-shadow: 0 0 10px var(--violet);
      transition: transform 0.05s ease-out, background-color 0.2s;
    }

    /* EJE Z: BRÚJULA SEMI-CIRCULAR AZIMUT (GIRO PLANO) */
    .compass-area {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .gauge-title {
      font-size: 0.72rem;
      font-weight: bold;
      color: var(--subtext);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 4px;
    }
    .compass-gauge {
      width: 100%;
      height: 110px;
      position: relative;
      background: #151515;
      border-radius: 110px 110px 0 0;
      border: 2px solid var(--primary);
      border-bottom: none;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }
    .downrange-label {
      position: absolute;
      top: 8px;
      font-size: 0.7rem;
      font-weight: bold;
      color: var(--primary);
      letter-spacing: 1px;
    }
    .compass-needle {
      position: absolute;
      bottom: 0;
      width: 4px;
      height: 80px;
      background: var(--primary);
      transform-origin: bottom center;
      transition: transform 0.08s ease-out, background-color 0.2s;
      border-radius: 2px;
    }
    .compass-center {
      position: absolute;
      bottom: -8px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
    }

    /* EJE Y: NIVEL TRANSVERSAL VERDE (BARRA HORIZONTAL EN PANTALLA) */
    .level-horizontal-wrapper {
      grid-column: 2;
      grid-row: 2;
      width: 100%;
      height: 40px;
      background: #151515;
      border: 2px solid var(--primary);
      border-radius: 20px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .level-h-ring {
      position: absolute;
      width: 40px;
      height: 100%;
      border-left: 2px dashed var(--warning);
      border-right: 2px dashed var(--warning);
      background: rgba(255, 214, 0, 0.08);
    }
    .bubble-h {
      width: 28px;
      height: 28px;
      background: var(--primary);
      border-radius: 50%;
      position: absolute;
      box-shadow: 0 0 10px var(--primary);
      transition: transform 0.05s ease-out, background-color 0.2s;
    }

    /* INDICADORES TRIPLES DE VALORES */
    .pointer-display {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-top: 10px;
    }
    .pointer-box {
      background: #181818;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
      text-align: center;
    }
    .pointer-symbol { font-size: 1.3rem; font-weight: bold; margin: 2px 0; color: var(--primary); }
    .pointer-value { font-size: 0.8rem; font-weight: bold; }
    .out-range { color: var(--danger) !important; }
    .in-range { color: var(--primary) !important; }

    /* CONTROLES E INPUTS */
    .btn-group { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      color: #000;
      background-color: var(--primary);
    }
    button.btn-sec { background-color: #333; color: var(--text); border: 1px solid var(--border); }
    button.btn-warn { background-color: var(--warning); color: #000; }

    .input-col { display: flex; flex-direction: column; gap: 6px; }
    .input-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; }
    input[type="number"] {
      width: 65px;
      padding: 5px;
      background: #282828;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 6px;
      text-align: center;
      font-size: 0.85rem;
    }

    /* LOGS */
    .log-container {
      max-height: 120px;
      overflow-y: auto;
      background: #121212;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px;
      font-family: monospace;
      font-size: 0.75rem;
    }
    .log-item { margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; }
  </style>
</head>
<body>

<div class="container">
  <h1>Nivelador de Carabina</h1>

  <!-- PANEL DE DIAGNÓSTICO -->
  <div class="card diag-panel">
    <div class="diag-title">🔍 MODO MAPEO TRIPLE EJE (X, Y, Z)</div>
    <div class="diag-item"><span>Protocolo HTTPS:</span><span id="diag-protocol">-</span></div>
    <div class="diag-item"><span>Eventos Recibidos:</span><span id="diag-count">0</span></div>
  </div>

  <!-- TARJETA PRINCIPAL CON LOS 3 SENSORES MAPEADOS -->
  <div class="card">
    <div class="main-grid">
      
      <!-- EJE X: BARRA VIOLETA LONGITUDINAL (ELEVACIÓN CAÑÓN) -->
      <div class="level-vertical-wrapper" title="Eje X: Elevación del Cañón">
        <div class="level-v-ring"></div>
        <div id="bubble-x" class="bubble-v"></div>
      </div>

      <!-- EJE Z: BRÚJULA SEMI-CIRCULAR AZIMUT (GIRO PLANO) -->
      <div class="compass-area">
        <div class="gauge-title">EJE Z: Downrange (Azimut)</div>
        <div id="gauge-z" class="compass-gauge">
          <div class="downrange-label">▲ DOWNRANGE (0°)</div>
          <div id="needle-z" class="compass-needle"></div>
          <div class="compass-center"></div>
        </div>
      </div>

      <!-- EJE Y: BARRA VERDE TRANSVERSAL (CANTEO LATERAL) -->
      <div style="grid-column: 2; grid-row: 2;">
        <div class="gauge-title" style="margin-bottom:2px;">EJE Y: Canteo Lateral</div>
        <div id="gauge-y" class="level-horizontal-wrapper">
          <div class="level-h-ring"></div>
          <div id="bubble-y" class="bubble-h"></div>
        </div>
      </div>

    </div>

    <!-- TRES INDICADORES DE VALORES -->
    <div class="pointer-display">
      <div class="pointer-box">
        <div style="font-size:0.65rem; color:var(--violet); font-weight:bold;">EJE X (ELEV)</div>
        <div id="sym-x" class="pointer-symbol">✓</div>
        <div id="val-x" class="pointer-value in-range">0.0°</div>
      </div>
      <div class="pointer-box">
        <div style="font-size:0.65rem; color:var(--primary); font-weight:bold;">EJE Y (CANTEO)</div>
        <div id="sym-y" class="pointer-symbol">✓</div>
        <div id="val-y" class="pointer-value in-range">0.0°</div>
      </div>
      <div class="pointer-box">
        <div style="font-size:0.65rem; color:var(--primary); font-weight:bold;">EJE Z (AZIMUT)</div>
        <div id="sym-z" class="pointer-symbol">✓</div>
        <div id="val-z" class="pointer-value in-range">0.0°</div>
      </div>
    </div>
  </div>

  <!-- CONTROLES Y TOLERANCIAS INDEPENDIENTES -->
  <div class="card" style="display:flex; flex-direction:column; gap:8px;">
    <button id="btn-calibrate" class="btn-warn">1. CALIBRAR CERO (3 EJES)</button>
    
    <div class="btn-group">
      <button id="btn-audio" class="btn-sec">🔊 Alerta: OFF</button>
      <button id="btn-wakelock" class="btn-sec">📱 Pantalla ON</button>
    </div>

    <div class="input-col">
      <div class="input-row">
        <label for="tol-x-input">Tol. Eje X - Elevación (±°):</label>
        <input type="number" id="tol-x-input" value="15.0" step="0.5" min="0.1" max="90">
      </div>
      <div class="input-row">
        <label for="tol-y-input">Tol. Eje Y - Canteo (±°):</label>
        <input type="number" id="tol-y-input" value="5.0" step="0.5" min="0.1" max="90">
      </div>
      <div class="input-row">
        <label for="tol-z-input">Tol. Eje Z - Azimut (±°):</label>
        <input type="number" id="tol-z-input" value="45.0" step="0.5" min="0.1" max="90">
      </div>
    </div>
  </div>

  <!-- HISTORIAL / LOGS -->
  <div class="card" style="display:flex; flex-direction:column; gap:6px;">
    <button id="btn-log-shot">🎯 REGISTRAR DISPARO EN LOG</button>
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-size:0.75rem; color:var(--subtext);">Historial:</span>
      <div>
        <button id="btn-copy-log" style="padding:3px 6px; font-size:0.7rem;" class="btn-sec">Copiar</button>
        <button id="btn-clear-log" style="padding:3px 6px; font-size:0.7rem;" class="btn-sec">Limpiar</button>
      </div>
    </div>
    <div id="log-list" class="log-container">
      <div style="color:var(--subtext); text-align:center;">Esperando disparos...</div>
    </div>
  </div>
</div>

<script>
  let eventCount = 0;
  let audioCtx = null;
  let audioEnabled = false;

  // Calibración Cero
  let targetX = 0; // Pitch (Elevación)
  let targetY = 0; // Roll (Canteo)
  let targetZ = 0; // Yaw (Azimut)

  // Valores Actuales
  let currentX = 0;
  let currentY = 0;
  let currentZ = 0;

  // Tolerancias
  let tolX = 15.0;
  let tolY = 5.0;
  let tolZ = 45.0;

  // Elementos UI
  const bubbleX = document.getElementById('bubble-x');
  const bubbleY = document.getElementById('bubble-y');
  const needleZ = document.getElementById('needle-z');
  const gaugeY = document.getElementById('gauge-y');
  const gaugeZ = document.getElementById('gauge-z');

  const symX = document.getElementById('sym-x');
  const valX = document.getElementById('val-x');
  const symY = document.getElementById('sym-y');
  const valY = document.getElementById('val-y');
  const symZ = document.getElementById('sym-z');
  const valZ = document.getElementById('val-z');

  const btnCalibrate = document.getElementById('btn-calibrate');
  const btnAudio = document.getElementById('btn-audio');
  const btnWakelock = document.getElementById('btn-wakelock');
  const btnLogShot = document.getElementById('btn-log-shot');
  const btnCopyLog = document.getElementById('btn-copy-log');
  const btnClearLog = document.getElementById('btn-clear-log');

  const tolXInput = document.getElementById('tol-x-input');
  const tolYInput = document.getElementById('tol-y-input');
  const tolZInput = document.getElementById('tol-z-input');
  const logList = document.getElementById('log-list');

  function init() {
    const isHttps = location.protocol === 'https:' || location.hostname === 'localhost';
    document.getElementById('diag-protocol').innerHTML = isHttps 
      ? '<span class="status-ok">HTTPS OK</span>' 
      : '<span class="status-bad">SÓLO HTTPS</span>';

    if ('ondeviceorientationabsolute' in window) {
      window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    } else if ('DeviceOrientationEvent' in window) {
      window.addEventListener('deviceorientation', handleOrientation, true);
    }
  }

  function handleOrientation(e) {
    eventCount++;
    document.getElementById('diag-count').innerText = eventCount;

    let alpha = e.alpha || 0;
    let beta = e.beta || 0;
    let gamma = e.gamma || 0;

    // Mapa de ejes con teléfono plano sobre la mira:
    // EJE X (Longitudinal / Elevación cañón) -> Beta (Inclinación adelante/atrás)
    currentX = beta;

    // EJE Y (Transversal / Canteo lateral) -> Gamma (Ladeo izquierda/derecha)
    currentY = gamma;

    // EJE Z (Azimut plano / Giro sobre la mesa) -> Alpha o Brújula
    if (e.webkitCompassHeading) {
      currentZ = e.webkitCompassHeading;
    } else {
      currentZ = 360 - alpha;
    }

    updateUI();
  }

  function updateUI() {
    tolX = parseFloat(tolXInput.value) || 15.0;
    tolY = parseFloat(tolYInput.value) || 5.0;
    tolZ = parseFloat(tolZInput.value) || 45.0;

    let diffX = currentX - targetX;
    let diffY = currentY - targetY;
    let diffZ = (currentZ - targetZ + 540) % 360 - 180;

    // 1. MOVER BUBBLE X (Barra Violeta Vertical - Elevación)
    // Subir cañón = burbuja sube; Bajar cañón = burbuja baja
    let clampXPos = Math.max(-80, Math.min(80, (diffX / tolX) * -40));
    bubbleX.style.transform = `translateY(${clampXPos}px)`;

    // 2. MOVER BUBBLE Y (Barra Verde Horizontal - Canteo)
    let clampYPos = Math.max(-100, Math.min(100, (diffY / tolY) * 40));
    bubbleY.style.transform = `translateX(${clampYPos}px)`;

    // 3. MOVER AGUJA Z (Brújula Semi-circular - Azimut)
    let scaledZAngle = (diffZ / tolZ) * 45; 
    let clampZAngle = Math.max(-85, Math.min(85, scaledZAngle));
    needleZ.style.transform = `rotate(${clampZAngle}deg)`;

    // Evaluar rangos independientes
    let isXOk = Math.abs(diffX) <= tolX;
    let isYOk = Math.abs(diffY) <= tolY;
    let isZOk = Math.abs(diffZ) <= tolZ;
    let isOverallOk = isXOk && isYOk && isZOk;

    // Colores visuales
    bubbleX.style.backgroundColor = isXOk ? 'var(--violet)' : 'var(--danger)';
    bubbleY.style.backgroundColor = isYOk ? 'var(--primary)' : 'var(--danger)';
    gaugeY.style.borderColor = isYOk ? 'var(--primary)' : 'var(--danger)';
    needleZ.style.background = isZOk ? 'var(--primary)' : 'var(--danger)';
    gaugeZ.style.borderColor = isZOk ? 'var(--primary)' : 'var(--danger)';

    // Indicadores numéricos y símbolos
    let symTextX = isXOk ? "✓" : (diffX > 0 ? "▲" : "▼");
    symX.innerText = symTextX;
    symX.className = `pointer-symbol ${isXOk ? 'in-range' : 'out-range'}`;
    valX.innerText = `${Math.abs(diffX).toFixed(1)}° ${symTextX}`;
    valX.className = `pointer-value ${isXOk ? 'in-range' : 'out-range'}`;

    let symTextY = isYOk ? "✓" : (diffY > 0 ? "->" : "<-");
    symY.innerText = symTextY;
    symY.className = `pointer-symbol ${isYOk ? 'in-range' : 'out-range'}`;
    valY.innerText = `${Math.abs(diffY).toFixed(1)}° ${symTextY}`;
    valY.className = `pointer-value ${isYOk ? 'in-range' : 'out-range'}`;

    let symTextZ = isZOk ? "✓" : (diffZ > 0 ? "->" : "<-");
    symZ.innerText = symTextZ;
    symZ.className = `pointer-symbol ${isZOk ? 'in-range' : 'out-range'}`;
    valZ.innerText = `${Math.abs(diffZ).toFixed(1)}° ${symTextZ}`;
    valZ.className = `pointer-value ${isZOk ? 'in-range' : 'out-range'}`;

    // Alerta sonora si alguno sale de tolerancia
    if (audioEnabled && !isOverallOk) {
      playBeep();
    }
  }

  function playBeep() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.value = 0.1;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  }

  btnCalibrate.onclick = () => {
    targetX = currentX;
    targetY = currentY;
    targetZ = currentZ;
    if (navigator.vibrate) navigator.vibrate(100);
    addLog(`[CALIBRACIÓN] Cero guardado (3 Ejes)`);
  };

  btnAudio.onclick = () => {
    audioEnabled = !audioEnabled;
    if (audioEnabled && !audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    btnAudio.innerText = audioEnabled ? "🔊 Alerta: ON" : "🔊 Alerta: OFF";
    btnAudio.className = audioEnabled ? "btn-warn" : "btn-sec";
  };

  btnWakelock.onclick = async () => {
    if ('wakeLock' in navigator) {
      try {
        await navigator.wakeLock.request('screen');
        btnWakelock.innerText = "📱 Pantalla: SI";
        btnWakelock.className = "btn-warn";
      } catch (err) {}
    }
  };

  function addLog(msg) {
    if (logList.children.length === 1 && logList.children[0].innerText.includes('Esperando')) {
      logList.innerHTML = '';
    }
    const div = document.createElement('div');
    div.className = 'log-item';
    div.innerHTML = `<span>${new Date().toLocaleTimeString()}</span> <b>${msg}</b>`;
    logList.prepend(div);
  }

  btnLogShot.onclick = () => {
    let diffX = (currentX - targetX).toFixed(1);
    let diffY = (currentY - targetY).toFixed(1);
    let diffZ = ((currentZ - targetZ + 540) % 360 - 180).toFixed(1);

    let symTextX = Math.abs(diffX) <= tolX ? "✓" : (diffX > 0 ? "▲" : "▼");
    let symTextY = Math.abs(diffY) <= tolY ? "✓" : (diffY > 0 ? "->" : "<-");
    let symTextZ = Math.abs(diffZ) <= tolZ ? "✓" : (diffZ > 0 ? "->" : "<-");

    addLog(`DISPARO: Elev(X): ${symTextX}${Math.abs(diffX)}° | Cant(Y): ${symTextY}${Math.abs(diffY)}° | Azim(Z): ${symTextZ}${Math.abs(diffZ)}°`);
    if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
  };

  btnClearLog.onclick = () => {
    logList.innerHTML = '<div style="color:var(--subtext); text-align:center;">Esperando disparos...</div>';
  };

  btnCopyLog.onclick = () => {
    navigator.clipboard.writeText(logList.innerText);
    alert("Log copiado al portapapeles.");
  };

  window.onload = init;
</script>
</body>
</html>
