<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Nivelador de Carabina - Diales Separados</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --primary: #00e676;
      --danger: #ff5252;
      --warning: #ffd600;
      --text: #ffffff;
      --subtext: #aaaaaa;
      --border: #333333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      min-height: 100vh;
    }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    h1 { font-size: 1.1rem; text-align: center; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }
    
    /* Panel de Diagnóstico */
    .diag-panel {
      background-color: #181818;
      border-left: 4px solid var(--warning);
      font-size: 0.8rem;
      font-family: monospace;
    }
    .diag-title { font-weight: bold; color: var(--warning); margin-bottom: 4px; font-size: 0.85rem; }
    .diag-item { display: flex; justify-content: space-between; margin-bottom: 2px; }
    .status-ok { color: var(--primary); font-weight: bold; }
    .status-bad { color: var(--danger); font-weight: bold; }

    /* DIAL 1: Brújula Semi-Circular (Azimut 180°) */
    .gauge-title {
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--subtext);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 6px;
    }
    .compass-gauge {
      width: 100%;
      height: 120px;
      position: relative;
      background: #151515;
      border-radius: 120px 120px 0 0;
      border: 2px solid var(--border);
      border-bottom: none;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }
    .downrange-label {
      position: absolute;
      top: 10px;
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--primary);
      letter-spacing: 1px;
    }
    .compass-needle {
      position: absolute;
      bottom: 0;
      width: 4px;
      height: 90px;
      background: var(--danger);
      transform-origin: bottom center;
      transition: transform 0.05s ease-out;
      border-radius: 2px;
    }
    .compass-center {
      position: absolute;
      bottom: -10px;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
    }

    /* DIAL 2: Nivel Torpedo Horizontal (Elevación/Roll) */
    .torpedo-level {
      width: 100%;
      height: 40px;
      background: #151515;
      border: 2px solid var(--border);
      border-radius: 20px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-top: 6px;
    }
    .torpedo-center-ring {
      position: absolute;
      width: 50px;
      height: 100%;
      border-left: 2px dashed var(--warning);
      border-right: 2px dashed var(--warning);
      background: rgba(255, 214, 0, 0.05);
    }
    .torpedo-bubble {
      width: 32px;
      height: 28px;
      background: var(--primary);
      border-radius: 14px;
      position: absolute;
      box-shadow: 0 0 12px var(--primary);
      transition: transform 0.05s ease-out, background-color 0.2s;
    }

    /* Indicadores y Punteros */
    .pointer-display {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .pointer-box {
      background: #181818;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }
    .pointer-symbol { font-size: 1.5rem; font-weight: bold; margin: 2px 0; color: var(--primary); }
    .pointer-value { font-size: 0.85rem; font-weight: bold; }
    .out-range { color: var(--danger) !important; }
    .in-range { color: var(--primary) !important; }

    /* Botones e Inputs */
    .btn-group { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      color: #000;
      background-color: var(--primary);
    }
    button.btn-sec { background-color: #333; color: var(--text); border: 1px solid var(--border); }
    button.btn-warn { background-color: var(--warning); color: #000; }

    .input-col { display: flex; flex-direction: column; gap: 8px; }
    .input-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    input[type="number"] {
      width: 75px;
      padding: 6px;
      background: #282828;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 6px;
      text-align: center;
      font-size: 0.9rem;
    }

    /* Logs */
    .log-container {
      max-height: 130px;
      overflow-y: auto;
      background: #121212;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      font-family: monospace;
      font-size: 0.8rem;
    }
    .log-item { margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; }
  </style>
</head>
<body>

<div class="container">
  <h1>Nivelador de Carabina</h1>

  <!-- DIAGNÓSTICO -->
  <div class="card diag-panel">
    <div class="diag-title">🔍 DIAGNÓSTICO</div>
    <div class="diag-item"><span>Protocolo:</span><span id="diag-protocol">-</span></div>
    <div class="diag-item"><span>Eventos:</span><span id="diag-count">0</span></div>
  </div>

  <!-- DIAL 1: BRÚJULA AZIMUT (180°) -->
  <div class="card">
    <div class="gauge-title">1. Desviación Acimutal (Rumbo / Downrange)</div>
    <div class="compass-gauge">
      <div class="downrange-label">▲ DOWNRANGE (0°)</div>
      <div id="compass-needle" class="compass-needle"></div>
      <div class="compass-center"></div>
    </div>

    <!-- DIAL 2: NIVEL TORPEDO (ELEVACIÓN / CANTEO) -->
    <div class="gauge-title" style="margin-top: 14px;">2. Inclinación / Elevación (Nivel Torpedo)</div>
    <div class="torpedo-level">
      <div class="torpedo-center-ring"></div>
      <div id="torpedo-bubble" class="torpedo-bubble"></div>
    </div>

    <!-- PUNTEROS Y SÍMBOLOS -->
    <div class="pointer-display">
      <div class="pointer-box">
        <div style="font-size:0.7rem; color:var(--subtext);">CANTEO/ELEV.</div>
        <div id="sym-roll" class="pointer-symbol">✓</div>
        <div id="val-roll" class="pointer-value in-range">0.0°</div>
      </div>
      <div class="pointer-box">
        <div style="font-size:0.7rem; color:var(--subtext);">AZIMUT/DOWNRANGE</div>
        <div id="sym-azimuth" class="pointer-symbol">✓</div>
        <div id="val-azimuth" class="pointer-value in-range">0.0°</div>
      </div>
    </div>
  </div>

  <!-- CONTROLES Y PARÁMETROS -->
  <div class="card" style="display:flex; flex-direction:column; gap:10px;">
    <button id="btn-calibrate" class="btn-warn">1. CALIBRAR CERO (DOWNRANGE)</button>
    
    <div class="btn-group">
      <button id="btn-audio" class="btn-sec">🔊 Alerta: OFF</button>
      <button id="btn-wakelock" class="btn-sec">📱 Pantalla ON</button>
    </div>

    <div class="input-col">
      <div class="input-row">
        <label for="tol-roll-input">Tol. Elevación (± Grados):</label>
        <input type="number" id="tol-roll-input" value="15.0" step="0.5" min="0.1" max="90">
      </div>
      <div class="input-row">
        <label for="tol-azi-input">Tol. Acimut (± Grados):</label>
        <input type="number" id="tol-azi-input" value="45.0" step="0.5" min="0.1" max="90">
      </div>
    </div>
  </div>

  <!-- HISTORIAL / LOGS -->
  <div class="card" style="display:flex; flex-direction:column; gap:8px;">
    <button id="btn-log-shot">🎯 REGISTRAR DISPARO EN LOG</button>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:2px;">
      <span style="font-size:0.75rem; color:var(--subtext);">Historial:</span>
      <div>
        <button id="btn-copy-log" style="padding:4px 8px; font-size:0.75rem;" class="btn-sec">Copiar</button>
        <button id="btn-clear-log" style="padding:4px 8px; font-size:0.75rem;" class="btn-sec">Limpiar</button>
      </div>
    </div>
    <div id="log-list" class="log-container">
      <div style="color:var(--subtext); text-align:center;">Esperando disparos...</div>
    </div>
  </div>
</div>

<script>
  let eventCount = 0;
  let audioCtx = null;
  let audioEnabled = false;

  let targetRoll = 0;
  let targetAzimuth = 0;
  let currentRoll = 0;
  let currentAzimuth = 0;

  let tolRoll = 15.0;
  let tolAzi = 45.0;

  const compassNeedle = document.getElementById('compass-needle');
  const torpedoBubble = document.getElementById('torpedo-bubble');
  const symRoll = document.getElementById('sym-roll');
  const valRoll = document.getElementById('val-roll');
  const symAzimuth = document.getElementById('sym-azimuth');
  const valAzimuth = document.getElementById('val-azimuth');

  const btnCalibrate = document.getElementById('btn-calibrate');
  const btnAudio = document.getElementById('btn-audio');
  const btnWakelock = document.getElementById('btn-wakelock');
  const btnLogShot = document.getElementById('btn-log-shot');
  const btnCopyLog = document.getElementById('btn-copy-log');
  const btnClearLog = document.getElementById('btn-clear-log');
  const tolRollInput = document.getElementById('tol-roll-input');
  const tolAziInput = document.getElementById('tol-azi-input');
  const logList = document.getElementById('log-list');

  function init() {
    const isHttps = location.protocol === 'https:' || location.hostname === 'localhost';
    document.getElementById('diag-protocol').innerHTML = isHttps 
      ? '<span class="status-ok">HTTPS OK</span>' 
      : '<span class="status-bad">SÓLO HTTPS</span>';

    if ('ondeviceorientationabsolute' in window) {
      window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    } else if ('DeviceOrientationEvent' in window) {
      window.addEventListener('deviceorientation', handleOrientation, true);
    }
  }

  function handleOrientation(e) {
    eventCount++;
    document.getElementById('diag-count').innerText = eventCount;

    if (e.gamma !== null) currentRoll = e.gamma;
    if (e.webkitCompassHeading) {
      currentAzimuth = e.webkitCompassHeading;
    } else if (e.alpha !== null) {
      currentAzimuth = 360 - e.alpha;
    }

    updateUI();
  }

  function updateUI() {
    tolRoll = parseFloat(tolRollInput.value) || 15.0;
    tolAzi = parseFloat(tolAziInput.value) || 45.0;

    let diffRoll = currentRoll - targetRoll;
    let diffAzimuth = (currentAzimuth - targetAzimuth + 540) % 360 - 180;

    // 1. DIAL ACIMUT: Mover Aguja (-90° a +90°)
    let clampAziAngle = Math.max(-90, Math.min(90, diffAzimuth));
    compassNeedle.style.transform = `rotate(${clampAziAngle}deg)`;

    // 2. DIAL TORPEDO: Mover Burbuja Horizontalmente
    let clampRollPos = Math.max(-140, Math.min(140, (diffRoll / tolRoll) * 50));
    torpedoBubble.style.transform = `translateX(${clampRollPos}px)`;

    // Evaluación de rangos
    let isRollOk = Math.abs(diffRoll) <= tolRoll;
    let isAziOk = Math.abs(diffAzimuth) <= tolAzi;
    let isOverallOk = isRollOk && isAziOk;

    // Colores
    compassNeedle.style.background = isAziOk ? 'var(--primary)' : 'var(--danger)';
    torpedoBubble.style.backgroundColor = isRollOk ? 'var(--primary)' : 'var(--danger)';

    // Indicador Canteo
    let rollSym = isRollOk ? "✓" : (diffRoll > 0 ? "->" : "<-");
    symRoll.innerText = rollSym;
    symRoll.className = `pointer-symbol ${isRollOk ? 'in-range' : 'out-range'}`;
    valRoll.innerText = `${Math.abs(diffRoll).toFixed(1)}° ${rollSym}`;
    valRoll.className = `pointer-value ${isRollOk ? 'in-range' : 'out-range'}`;

    // Indicador Acimut
    let aziSym = isAziOk ? "✓" : (diffAzimuth > 0 ? "v" : "^");
    symAzimuth.innerText = aziSym;
    symAzimuth.className = `pointer-symbol ${isAziOk ? 'in-range' : 'out-range'}`;
    valAzimuth.innerText = `${Math.abs(diffAzimuth).toFixed(1)}° ${aziSym}`;
    valAzimuth.className = `pointer-value ${isAziOk ? 'in-range' : 'out-range'}`;

    if (audioEnabled && !isOverallOk) {
      playBeep();
    }
  }

  function playBeep() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.value = 0.1;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  }

  btnCalibrate.onclick = () => {
    targetRoll = currentRoll;
    targetAzimuth = currentAzimuth;
    if (navigator.vibrate) navigator.vibrate(100);
    addLog(`[CALIBRACIÓN] Cero guardado`);
  };

  btnAudio.onclick = () => {
    audioEnabled = !audioEnabled;
    if (audioEnabled && !audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    btnAudio.innerText = audioEnabled ? "🔊 Alerta: ON" : "🔊 Alerta: OFF";
    btnAudio.className = audioEnabled ? "btn-warn" : "btn-sec";
  };

  btnWakelock.onclick = async () => {
    if ('wakeLock' in navigator) {
      try {
        await navigator.wakeLock.request('screen');
        btnWakelock.innerText = "📱 Pantalla: SI";
        btnWakelock.className = "btn-warn";
      } catch (err) {}
    }
  };

  function addLog(msg) {
    if (logList.children.length === 1 && logList.children[0].innerText.includes('Esperando')) {
      logList.innerHTML = '';
    }
    const div = document.createElement('div');
    div.className = 'log-item';
    div.innerHTML = `<span>${new Date().toLocaleTimeString()}</span> <b>${msg}</b>`;
    logList.prepend(div);
  }

  btnLogShot.onclick = () => {
    let diffRoll = (currentRoll - targetRoll).toFixed(1);
    let diffAzimuth = ((currentAzimuth - targetAzimuth + 540) % 360 - 180).toFixed(1);
    let rollSym = Math.abs(diffRoll) <= tolRoll ? "✓" : (diffRoll > 0 ? "->" : "<-");
    let aziSym = Math.abs(diffAzimuth) <= tolAzi ? "✓" : (diffAzimuth > 0 ? "v" : "^");

    addLog(`DISPARO: R: ${rollSym} ${Math.abs(diffRoll)}° | A: ${aziSym} ${Math.abs(diffAzimuth)}°`);
    if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
  };

  btnClearLog.onclick = () => {
    logList.innerHTML = '<div style="color:var(--subtext); text-align:center;">Esperando disparos...</div>';
  };

  btnCopyLog.onclick = () => {
    navigator.clipboard.writeText(logList.innerText);
    alert("Log copiado al portapapeles.");
  };

  window.onload = init;
</script>
</body>
</html>
