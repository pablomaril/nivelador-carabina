<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Nivelador de Carabina - Aguja Fija Downrange</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --primary: #00e676;
      --danger: #ff5252;
      --warning: #ffd600;
      --text: #ffffff;
      --subtext: #aaaaaa;
      --border: #333333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      min-height: 100vh;
    }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 10px; }
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    h1 { font-size: 1.1rem; text-align: center; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }
    
    /* Panel de Diagnóstico */
    .diag-panel {
      background-color: #181818;
      border-left: 4px solid var(--warning);
      font-size: 0.75rem;
      font-family: monospace;
    }
    .diag-title { font-weight: bold; color: var(--warning); margin-bottom: 2px; }
    .diag-item { display: flex; justify-content: space-between; margin-bottom: 2px; }
    .status-ok { color: var(--primary); font-weight: bold; }

    /* LAYOUT DE LOS 3 EJES */
    .main-grid {
      display: grid;
      grid-template-columns: 45px 1fr;
      grid-template-rows: auto auto;
      gap: 10px;
      align-items: center;
    }

    /* EJE X: Nivel Torpedo Vertical */
    .torpedo-v-container {
      grid-column: 1;
      grid-row: 1;
      height: 140px;
      width: 100%;
      background: #151515;
      border: 2px solid var(--border);
      border-radius: 20px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .torpedo-v-ring {
      position: absolute;
      height: 40px;
      width: 100%;
      border-top: 2px dashed var(--warning);
      border-bottom: 2px dashed var(--warning);
      background: rgba(255, 214, 0, 0.05);
    }
    .bubble-v {
      width: 30px;
      height: 26px;
      background: var(--primary);
      border-radius: 13px;
      position: absolute;
      box-shadow: 0 0 10px var(--primary);
      transition: transform 0.05s ease-out, background-color 0.2s;
    }

    /* EJE Z: Brújula Semi-Circular */
    .compass-container {
      grid-column: 2;
      grid-row: 1;
      height: 140px;
      background: #151515;
      border-radius: 140px 140px 0 0;
      border: 2px solid var(--border);
      border-bottom: none;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .downrange-label {
      position: absolute;
      top: 8px;
      font-size: 0.7rem;
      font-weight: bold;
      color: var(--primary);
      letter-spacing: 1px;
    }
    .compass-needle {
      position: absolute;
      bottom: 0;
      width: 4px;
      height: 105px;
      background: var(--primary);
      transform-origin: bottom center;
      transition: transform 0.08s ease-out, background-color 0.2s;
      border-radius: 2px;
    }
    .compass-center {
      position: absolute;
      bottom: -10px;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
    }

    /* EJE Y: Nivel Torpedo Horizontal */
    .torpedo-h-container {
      grid-column: 1 / span 2;
      grid-row: 2;
      height: 40px;
      background: #151515;
      border: 2px solid var(--border);
      border-radius: 20px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .torpedo-h-ring {
      position: absolute;
      width: 50px;
      height: 100%;
      border-left: 2px dashed var(--warning);
      border-right: 2px dashed var(--warning);
      background: rgba(255, 214, 0, 0.05);
    }
    .bubble-h {
      width: 30px;
      height: 26px;
      background: var(--primary);
      border-radius: 13px;
      position: absolute;
      box-shadow: 0 0 10px var(--primary);
      transition: transform 0.05s ease-out, background-color 0.2s;
    }

    /* Punteros */
    .pointer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }
    .pointer-box {
      background: #181818;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px;
      text-align: center;
    }
    .pointer-title { font-size: 0.65rem; color: var(--subtext); text-transform: uppercase; }
    .pointer-symbol { font-size: 1.2rem; font-weight: bold; margin: 2px 0; color: var(--primary); }
    .pointer-value { font-size: 0.75rem; font-weight: bold; }
    .out-range { color: var(--danger) !important; }
    .in-range { color: var(--primary) !important; }

    /* Inputs y Botones */
    .btn-group { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      color: #000;
      background-color: var(--primary);
    }
    button.btn-sec { background-color: #333; color: var(--text); border: 1px solid var(--border); }
    button.btn-warn { background-color: var(--warning); color: #000; }

    select {
      width: 100%;
      padding: 8px;
      background: #282828;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .mic-meter-bg {
      width: 100%;
      height: 8px;
      background: #151515;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }
    .mic-meter-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.05s linear;
    }

    .input-col { display: flex; flex-direction: column; gap: 6px; }
    .input-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; }
    input[type="number"] {
      width: 65px;
      padding: 4px;
      background: #282828;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 6px;
      text-align: center;
      font-size: 0.85rem;
    }

    /* Logs */
    .log-container {
      max-height: 110px;
      overflow-y: auto;
      background: #121212;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px;
      font-family: monospace;
      font-size: 0.75rem;
    }
    .log-item { margin-bottom: 2px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; }
  </style>
</head>
<body>

<div class="container">
  <h1>Nivelador de Carabina</h1>

  <!-- DIAGNÓSTICO -->
  <div class="card diag-panel">
    <div class="diag-title">🔍 MODO AGUJA FIJA A DOWNRANGE</div>
    <div class="diag-item"><span>Protocolo:</span><span id="diag-protocol">-</span></div>
    <div class="diag-item"><span>Eventos:</span><span id="diag-count">0</span></div>
  </div>

  <!-- PANEL DE DIALES TRES EJES -->
  <div class="card">
    <div class="main-grid">
      <!-- EJE X (ELEVACIÓN LONGITUDINAL) -->
      <div class="torpedo-v-container">
        <div class="torpedo-v-ring"></div>
        <div id="bubble-v" class="bubble-v"></div>
      </div>

      <!-- EJE Z (AZIMUT / BRÚJULA TIPO NORTE) -->
      <div id="compass-box" class="compass-container">
        <div class="downrange-label">▲ DOWNRANGE (OBJETIVO)</div>
        <div id="compass-needle" class="compass-needle"></div>
        <div class="compass-center"></div>
      </div>

      <!-- EJE Y (CANTEO LATERAL) -->
      <div class="torpedo-h-container">
        <div class="torpedo-h-ring"></div>
        <div id="bubble-h" class="bubble-h"></div>
      </div>
    </div>

    <!-- PUNTEROS Y LECTURAS -->
    <div class="pointer-grid">
      <div class="pointer-box">
        <div class="pointer-title">X (Elevación)</div>
        <div id="sym-x" class="pointer-symbol">✓</div>
        <div id="val-x" class="pointer-value in-range">0.0°</div>
      </div>
      <div class="pointer-box">
        <div class="pointer-title">Z (Azimut)</div>
        <div id="sym-z" class="pointer-symbol">✓</div>
        <div id="val-z" class="pointer-value in-range">0.0°</div>
      </div>
      <div class="pointer-box">
        <div class="pointer-title">Y (Canteo)</div>
        <div id="sym-y" class="pointer-symbol">✓</div>
        <div id="val-y" class="pointer-value in-range">0.0°</div>
      </div>
    </div>
  </div>

  <!-- PARÁMETROS Y CAPTURA MANOS LIBRES -->
  <div class="card" style="display:flex; flex-direction:column; gap:8px;">
    <button id="btn-calibrate" class="btn-warn">1. CALIBRAR CERO (DOWNRANGE)</button>
    
    <div class="btn-group">
      <button id="btn-audio" class="btn-sec">🔊 Alerta: OFF</button>
      <button id="btn-wakelock" class="btn-sec">📱 Pantalla ON</button>
    </div>

    <div style="margin-top: 4px;">
      <label style="font-size:0.8rem; color:var(--subtext); font-weight:bold;">Modo Registro de Disparo:</label>
      <select id="select-trigger-mode" style="margin-top:4px;">
        <option value="manual">Touch Manual (Botón)</option>
        <option value="audio_peak">Micrófono: Pico de Sonido (Click/Percutor)</option>
        <option value="voice">Voz: Comando ("Fuego" / "Ya")</option>
      </select>
    </div>

    <!-- MEDIDOR DE NIVEL DE MICRÓFONO -->
    <div id="mic-config-box" style="display:none; margin-top:2px;">
      <div class="input-row">
        <label for="input-mic-thresh">Umbral Sonoro Disparo:</label>
        <input type="number" id="input-mic-thresh" value="65" min="10" max="100">
      </div>
      <div class="mic-meter-bg">
        <div id="mic-meter-fill" class="mic-meter-fill"></div>
      </div>
    </div>

    <div class="input-col" style="margin-top:4px;">
      <div class="input-row">
        <label for="tol-x-input">Tol. Eje X (Elevación ±°):</label>
        <input type="number" id="tol-x-input" value="15.0" step="0.5">
      </div>
      <div class="input-row">
        <label for="tol-z-input">Tol. Eje Z (Azimut Max ±°):</label>
        <input type="number" id="tol-z-input" value="45.0" step="0.5">
      </div>
      <div class="input-row">
        <label for="tol-y-input">Tol. Eje Y (Canteo ±°):</label>
        <input type="number" id="tol-y-input" value="5.0" step="0.5">
      </div>
    </div>
  </div>

  <!-- LOGS -->
  <div class="card" style="display:flex; flex-direction:column; gap:6px;">
    <button id="btn-log-shot">🎯 REGISTRAR DISPARO EN LOG</button>
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-size:0.75rem; color:var(--subtext);">Historial:</span>
      <div>
        <button id="btn-copy-log" style="padding:2px 6px; font-size:0.7rem;" class="btn-sec">Copiar</button>
        <button id="btn-clear-log" style="padding:2px 6px; font-size:0.7rem;" class="btn-sec">Limpiar</button>
      </div>
    </div>
    <div id="log-list" class="log-container">
      <div style="color:var(--subtext); text-align:center;">Esperando disparos...</div>
    </div>
  </div>
</div>

<script>
  let eventCount = 0;
  let audioCtx = null;
  let audioEnabled = false;

  let targetX = 0;
  let targetY = 0;
  let targetZ = 0;

  let currentX = 0;
  let currentY = 0;
  let currentZ = 0;

  let tolX = 15.0;
  let tolZ = 45.0;
  let tolY = 5.0;

  // Audio Peak Detection & Voice Variables
  let micStream = null;
  let audioAnalyser = null;
  let micDataArray = null;
  let lastShotTime = 0;
  let speechRecognizer = null;

  const bubbleV = document.getElementById('bubble-v');
  const bubbleH = document.getElementById('bubble-h');
  const compassBox = document.getElementById('compass-box');
  const compassNeedle = document.getElementById('compass-needle');

  const symX = document.getElementById('sym-x');
  const valX = document.getElementById('val-x');
  const symZ = document.getElementById('sym-z');
  const valZ = document.getElementById('val-z');
  const symY = document.getElementById('sym-y');
  const valY = document.getElementById('val-y');

  const btnCalibrate = document.getElementById('btn-calibrate');
  const btnAudio = document.getElementById('btn-audio');
  const btnWakelock = document.getElementById('btn-wakelock');
  const btnLogShot = document.getElementById('btn-log-shot');
  const btnCopyLog = document.getElementById('btn-copy-log');
  const btnClearLog = document.getElementById('btn-clear-log');

  const selectTriggerMode = document.getElementById('select-trigger-mode');
  const micConfigBox = document.getElementById('mic-config-box');
  const inputMicThresh = document.getElementById('input-mic-thresh');
  const micMeterFill = document.getElementById('mic-meter-fill');

  const tolXInput = document.getElementById('tol-x-input');
  const tolZInput = document.getElementById('tol-z-input');
  const tolYInput = document.getElementById('tol-y-input');
  const logList = document.getElementById('log-list');

  function init() {
    const isHttps = location.protocol === 'https:' || location.hostname === 'localhost';
    document.getElementById('diag-protocol').innerHTML = isHttps 
      ? '<span class="status-ok">HTTPS OK</span>' 
      : '<span class="status-bad">REQUIERE HTTPS</span>';

    if ('ondeviceorientationabsolute' in window) {
      window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    } else if ('DeviceOrientationEvent' in window) {
      window.addEventListener('deviceorientation', handleOrientation, true);
    }
  }

  function handleOrientation(e) {
    eventCount++;
    document.getElementById('diag-count').innerText = eventCount;

    currentX = e.beta || 0;
    currentY = e.gamma || 0;

    if (e.webkitCompassHeading) {
      currentZ = e.webkitCompassHeading;
    } else if (e.alpha !== null) {
      currentZ = 360 - e.alpha;
    }

    updateUI();
  }

  function updateUI() {
    tolX = parseFloat(tolXInput.value) || 15.0;
    tolZ = parseFloat(tolZInput.value) || 45.0;
    tolY = parseFloat(tolYInput.value) || 5.0;

    let diffX = currentX - targetX;
    let diffY = currentY - targetY;
    let diffZ = (currentZ - targetZ + 540) % 360 - 180;

    // 1. EJE X (Elevación)
    let normalizedX = Math.max(-90, Math.min(90, diffX));
    let posX = (-normalizedX / 90) * 50; 
    bubbleV.style.transform = `translateY(${posX}px)`;

    // 2. EJE Z (Brújula / Aguja fija al Downrange)
    // Se invierte el signo (-diffZ) para que la aguja se mantenga apuntando al objetivo
    let scaledZAngle = (-diffZ / tolZ) * 45; 
    let clampZAngle = Math.max(-88, Math.min(88, scaledZAngle));
    compassNeedle.style.transform = `rotate(${clampZAngle}deg)`;

    // 3. EJE Y (Canteo)
    let normalizedY = Math.max(-90, Math.min(90, diffY));
    let posY = (-normalizedY / 90) * 130;
    bubbleH.style.transform = `translateX(${posY}px)`;

    let isXOk = Math.abs(diffX) <= tolX;
    let isZOk = Math.abs(diffZ) <= tolZ;
    let isYOk = Math.abs(diffY) <= tolY;
    let isOverallOk = isXOk && isZOk && isYOk;

    if (isZOk) {
      compassNeedle.style.backgroundColor = 'var(--primary)';
      compassBox.style.borderColor = 'var(--border)';
    } else {
      compassNeedle.style.backgroundColor = 'var(--danger)';
      compassBox.style.borderColor = 'var(--danger)';
    }

    bubbleV.style.backgroundColor = isXOk ? 'var(--primary)' : 'var(--danger)';
    bubbleH.style.backgroundColor = isYOk ? 'var(--primary)' : 'var(--danger)';

    let symXTxt = isXOk ? "✓" : (diffX > 0 ? "▲" : "▼");
    symX.innerText = symXTxt;
    symX.className = `pointer-symbol ${isXOk ? 'in-range' : 'out-range'}`;
    valX.innerText = `${Math.abs(diffX).toFixed(1)}° ${symXTxt}`;

    let symZTxt = isZOk ? "✓" : (diffZ > 0 ? "->" : "<-");
    symZ.innerText = symZTxt;
    symZ.className = `pointer-symbol ${isZOk ? 'in-range' : 'out-range'}`;
    valZ.innerText = `${Math.abs(diffZ).toFixed(1)}° ${symZTxt}`;

    let symYTxt = isYOk ? "✓" : (diffY > 0 ? "->" : "<-");
    symY.innerText = symYTxt;
    symY.className = `pointer-symbol ${isYOk ? 'in-range' : 'out-range'}`;
    valY.innerText = `${Math.abs(diffY).toFixed(1)}° ${symYTxt}`;

    if (audioEnabled && !isOverallOk) {
      playBeep();
    }
  }

  function playBeep() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.value = 0.1;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  }

  // LOGICA DE CAPTURA DE MICRÓFONO Y VOZ
  selectTriggerMode.onchange = async () => {
    let mode = selectTriggerMode.value;
    stopMicListening();
    stopVoiceRecognition();

    if (mode === 'audio_peak') {
      micConfigBox.style.display = 'block';
      startMicListening();
    } else if (mode === 'voice') {
      micConfigBox.style.display = 'none';
      startVoiceRecognition();
    } else {
      micConfigBox.style.display = 'none';
    }
  };

  async function startMicListening() {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      let context = new (window.AudioContext || window.webkitAudioContext)();
      let source = context.createMediaStreamSource(micStream);
      audioAnalyser = context.createAnalyser();
      audioAnalyser.fftSize = 256;
      source.connect(audioAnalyser);

      micDataArray = new Uint8Array(audioAnalyser.frequencyBinCount);
      processAudioPeak();
    } catch (err) {
      alert("No se pudo acceder al micrófono.");
      selectTriggerMode.value = 'manual';
      micConfigBox.style.display = 'none';
    }
  }

  function processAudioPeak() {
    if (!audioAnalyser || selectTriggerMode.value !== 'audio_peak') return;

    audioAnalyser.getByteFrequencyData(micDataArray);
    let maxVolume = 0;
    for (let i = 0; i < micDataArray.length; i++) {
      if (micDataArray[i] > maxVolume) maxVolume = micDataArray[i];
    }

    let volPercent = Math.min(100, Math.round((maxVolume / 255) * 100));
    micMeterFill.style.width = `${volPercent}%`;

    let threshold = parseInt(inputMicThresh.value) || 65;
    let now = Date.now();

    if (volPercent >= threshold && (now - lastShotTime > 1500)) {
      lastShotTime = now;
      recordShot("MIC");
    }

    requestAnimationFrame(processAudioPeak);
  }

  function stopMicListening() {
    if (micStream) {
      micStream.getTracks().forEach(track => track.stop());
      micStream = null;
    }
    audioAnalyser = null;
  }

  function startVoiceRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("Tu navegador no soporta reconocimiento de voz nativo.");
      selectTriggerMode.value = 'manual';
      return;
    }

    speechRecognizer = new SpeechRecognition();
    speechRecognizer.lang = 'es-AR';
    speechRecognizer.continuous = true;
    speechRecognizer.interimResults = false;

    speechRecognizer.onresult = (event) => {
      let lastResultIndex = event.results.length - 1;
      let text = event.results[lastResultIndex][0].transcript.trim().toLowerCase();
      
      if (text.includes("fuego") || text.includes("ya") || text.includes("disparo") || text.includes("shot")) {
        recordShot("VOZ");
      }
    };

    speechRecognizer.onend = () => {
      if (selectTriggerMode.value === 'voice') {
        speechRecognizer.start();
      }
    };

    speechRecognizer.start();
  }

  function stopVoiceRecognition() {
    if (speechRecognizer) {
      speechRecognizer.stop();
      speechRecognizer = null;
    }
  }

  function recordShot(sourceLabel = "MANUAL") {
    let diffX = (currentX - targetX).toFixed(1);
    let diffY = (currentY - targetY).toFixed(1);
    let diffZ = ((currentZ - targetZ + 540) % 360 - 180).toFixed(1);

    addLog(`[${sourceLabel}] X:${diffX}° | Z:${diffZ}° | Y:${diffY}°`);
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
  }

  btnLogShot.onclick = () => recordShot("MANUAL");

  btnCalibrate.onclick = () => {
    targetX = currentX;
    targetY = currentY;
    targetZ = currentZ;
    if (navigator.vibrate) navigator.vibrate(100);
    addLog(`[CALIBRACIÓN] Cero fijado`);
  };

  btnAudio.onclick = () => {
    audioEnabled = !audioEnabled;
    if (audioEnabled && !audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    btnAudio.innerText = audioEnabled ? "🔊 Alerta: ON" : "🔊 Alerta: OFF";
    btnAudio.className = audioEnabled ? "btn-warn" : "btn-sec";
  };

  btnWakelock.onclick = async () => {
    if ('wakeLock' in navigator) {
      try {
        await navigator.wakeLock.request('screen');
        btnWakelock.innerText = "📱 Pantalla: SI";
        btnWakelock.className = "btn-warn";
      } catch (err) {}
    }
  };

  function addLog(msg) {
    if (logList.children.length === 1 && logList.children[0].innerText.includes('Esperando')) {
      logList.innerHTML = '';
    }
    const div = document.createElement('div');
    div.className = 'log-item';
    div.innerHTML = `<span>${new Date().toLocaleTimeString()}</span> <b>${msg}</b>`;
    logList.prepend(div);
  }

  btnClearLog.onclick = () => {
    logList.innerHTML = '<div style="color:var(--subtext); text-align:center;">Esperando disparos...</div>';
  };

  btnCopyLog.onclick = () => {
    navigator.clipboard.writeText(logList.innerText);
    alert("Log copiado al portapapeles.");
  };

  window.onload = init;
